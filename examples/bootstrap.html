<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>jGrowl and Bootstrap</title>

    <link rel="stylesheet" href="../jquery.jgrowl.css" type="text/css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">

    <style>
    body {
      padding-top: 60px;
    }
    #jGrowl-container1 {
      top: 60px;
    }
    </style>
  </head>

  <body>
    <div id="jGrowl-container1" class="jGrowl top-right"></div>

    <nav class="navbar navbar-expand-md bg-dark fixed-top" data-bs-theme="dark" aria-label="Main navigation">
      <div class="container">
        <a class="navbar-brand" href="#">jGrowl</a>
        <button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbar-navigation" aria-controls="navbar-navigation" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div id="navbar-navigation" class="collapse navbar-collapse">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="#">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
            <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container">

      <div>
        <h1>jGrowl and Bootstrap</h1>
        <p class="lead">This is a Bootstrap starter template with jGrowl integrated.  As you can see it's extremely easy to make jGrowl look and feel like part of Bootstrap.</p>
      </div>
      <div id="jGrowl-container2" class="jGrowl"></div>
    </div><!-- /.container -->


    <!-- Bootstrap core JavaScript
    ================================================== -->
    <!-- Placed at the end of the document so the pages load faster -->
    <script src="../node_modules/jquery/dist/jquery.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
    <script type="text/javascript" src="../jquery.jgrowl.js"></script>
    <script type="text/javascript">
    (function($){
        $(function(){
            $.jGrowl.defaults.closerTemplate = '<div class="alert alert-info">Close All</div>';

            var alertTypes = ['success', 'info', 'warning', 'danger'];

            for (var i=0; i<10; i++) {
                setTimeout(function(){
                    var alertType = alertTypes[Math.floor(Math.random()*alertTypes.length)];

                    $('#jGrowl-container1').jGrowl({
                        header: alertType.substring(0, 1).toUpperCase() + alertType.substring(1) + ' Notification',
                        message: 'Hello world ',
                        group: 'alert-' + alertType,
                        life: 5000
                    });
                }, i*2000);
            }
        });
    })(jQuery);
    </script>
  </body>
</html>
